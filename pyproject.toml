[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escalonamento-intervalos-paa"
version = "0.1.0"
description = "Escalonamento de Intervalos em Centro Cirúrgico: Comparativo Guloso vs. Programação Dinâmica (Clássico e Adaptado)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Allysson Assunção" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
